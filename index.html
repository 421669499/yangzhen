<style>
  :root{
    --up:#d92b2b;        /* 红涨 */
    --up-soft:#fdeaea;
    --down:#129d3e;      /* 绿跌 */
    --down-soft:#e6f6ea;
    --bg:#f4f6fa;
    --card:#ffffff;
    --ink:#1a1f2b;
    --ink-2:#5a6473;
    --ink-3:#8a93a3;
    --line:#e6eaf2;
    --brand:#1f3a8a;
    --high:#d92b2b;
    --mid:#e08a1e;
    --low:#129d3e;
    --shadow:0 1px 3px rgba(20,30,60,.06),0 8px 24px rgba(20,30,60,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);font-size:13px;line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1560px;margin:0 auto;padding:20px 22px 60px}

  /* 顶栏 */
  header{display:flex;align-items:center;justify-content:space-between;
    flex-wrap:wrap;gap:14px;margin-bottom:18px}
  .brand{display:flex;align-items:center;gap:13px}
  .brand .logo{width:42px;height:42px;border-radius:11px;
    background:linear-gradient(140deg,#d92b2b,#8c1414);display:flex;
    align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:19px;
    box-shadow:0 4px 12px rgba(217,43,43,.3)}
  .brand h1{font-size:19px;font-weight:800;letter-spacing:.3px}
  .brand .sub{font-size:12px;color:var(--ink-3);margin-top:1px}
  .meta{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  .pill{background:var(--card);border:1px solid var(--line);border-radius:8px;
    padding:6px 12px;font-size:12px;color:var(--ink-2);box-shadow:var(--shadow)}
  .pill b{color:var(--ink);font-weight:700}
  .btn{background:var(--brand);color:#fff;border:none;border-radius:8px;
    padding:8px 15px;font-size:12.5px;cursor:pointer;font-weight:600;
    transition:.15s;box-shadow:0 2px 8px rgba(31,58,138,.22)}
  .btn:hover{background:#16296b;transform:translateY(-1px)}
  .btn.ghost{background:var(--card);color:var(--ink-2);border:1px solid var(--line);
    box-shadow:var(--shadow)}
  .btn.ghost:hover{background:#f7f9fc;color:var(--ink)}

  /* 概览卡 */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));
    gap:12px;margin-bottom:16px}
  .kpi{background:var(--card);border-radius:12px;padding:14px 16px;
    box-shadow:var(--shadow);border:1px solid var(--line);position:relative;
    overflow:hidden}
  .kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
    background:var(--brand);opacity:.65}
  .kpi.up::after{background:var(--up)}
  .kpi.dn::after{background:var(--down)}
  .kpi.wn::after{background:var(--mid)}
  .kpi .k-l{font-size:11.5px;color:var(--ink-3);margin-bottom:5px;
    letter-spacing:.2px;font-weight:500}
  .kpi .k-v{font-size:24px;font-weight:800;letter-spacing:-.5px;line-height:1.15}
  .kpi .k-x{font-size:11px;color:var(--ink-3);margin-top:3px}
  .kpi.up .k-v{color:var(--up)}
  .kpi.dn .k-v{color:var(--down)}

  /* 图表区 */
  .charts{display:grid;grid-template-columns:1.15fr 1fr 1.25fr;gap:12px;margin-bottom:16px}
  @media(max-width:1200px){.charts{grid-template-columns:1fr}}
  .card{background:var(--card);border-radius:12px;box-shadow:var(--shadow);
    border:1px solid var(--line);padding:14px 16px}
  .card h3{font-size:13.5px;font-weight:700;margin-bottom:10px;
    display:flex;align-items:center;gap:7px}
  .card h3::before{content:"";width:3px;height:13px;border-radius:2px;
    background:var(--brand)}
  .chart{width:100%;height:212px}

  /* 工具条 */
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:11px 14px;margin-bottom:14px;box-shadow:var(--shadow)}
  .seg{display:flex;background:#eef1f7;border-radius:8px;padding:3px;gap:2px}
  .seg button{border:none;background:transparent;padding:6px 13px;border-radius:6px;
    font-size:12.5px;cursor:pointer;color:var(--ink-2);font-weight:600;transition:.14s}
  .seg button.on{background:#fff;color:var(--brand);box-shadow:0 1px 4px rgba(0,0,0,.09)}
  input.search{flex:1;min-width:160px;border:1px solid var(--line);border-radius:8px;
    padding:8px 12px;font-size:12.5px;outline:none;background:#fbfcfe}
  input.search:focus{border-color:var(--brand);background:#fff}
  select.sel{border:1px solid var(--line);border-radius:8px;padding:8px 10px;
    font-size:12.5px;background:#fbfcfe;outline:none;cursor:pointer;color:var(--ink-2)}
  .cnt{font-size:12px;color:var(--ink-3);margin-left:auto;white-space:nowrap}
  .cnt b{color:var(--brand);font-weight:700}

  /* 表格 */
  .tbl-wrap{background:var(--card);border-radius:12px;box-shadow:var(--shadow);
    border:1px solid var(--line);overflow:hidden}
  .tbl-scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:1180px}
  thead th{background:#f7f9fd;color:var(--ink-2);font-weight:700;font-size:11.5px;
    text-align:left;padding:11px 12px;border-bottom:1.5px solid var(--line);
    white-space:nowrap;cursor:pointer;user-select:none;letter-spacing:.2px}
  thead th:hover{color:var(--brand)}
  thead th .srt{color:var(--ink-3);font-size:9px;margin-left:3px}
  tbody td{padding:11px 12px;border-bottom:1px solid #f1f4f9;vertical-align:middle}
  tbody tr{cursor:pointer;transition:background .12s}
  tbody tr:hover{background:#f8fafd}
  tbody tr.open{background:#f2f6fd}
  .code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;
    color:var(--ink-2);font-weight:600}
  .nm{font-weight:700;color:var(--ink)}
  .time{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:12.5px}
  .time.early{color:var(--up)}
  .up{color:var(--up);font-weight:700}
  .dn{color:var(--down);font-weight:700}
  .lb{display:inline-flex;align-items:center;justify-content:center;
    min-width:22px;height:22px;padding:0 7px;border-radius:6px;font-weight:800;
    font-size:11.5px;background:#eef1f7;color:var(--ink-2)}
  .lb.h2{background:#ffefe3;color:#c85a12}
  .lb.h3{background:#ffe4e4;color:#c01c1c}
  .lb.h4{background:#ffd6d6;color:#a30f0f}
  .lb.h5{background:#ffc2c2;color:#8c0808}
  .tag{display:inline-block;padding:2px 8px;border-radius:5px;font-size:11px;
    font-weight:600;margin:1.5px 2px;background:#eef1f7;color:var(--ink-2);
    white-space:nowrap}
  .tag.msg{background:#e8f0ff;color:#1a4ec0}
  .tag.sec{background:#e9f7ef;color:#0d7a3c}
  .tag.lb{background:#ffefe3;color:#c05e12}
  .tag.money{background:#fdf0e3;color:#b06010}
  .tag.one{background:#fce8f3;color:#a81a6b}
  .tag.low{background:#eef0fb;color:#3b46a8}
  .risk{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;
    border-radius:6px;font-size:11.5px;font-weight:700;white-space:nowrap}
  .risk i{width:6px;height:6px;border-radius:50%;font-style:normal}
  .risk.high{background:#fdeaea;color:var(--high)}
  .risk.high i{background:var(--high);box-shadow:0 0 0 3px rgba(217,43,43,.15)}
  .risk.mid{background:#fff5e6;color:#b9730f}
  .risk.mid i{background:var(--mid)}
  .risk.low{background:#e9f7ef;color:var(--low)}
  .risk.low i{background:var(--low)}
  .trend{font-weight:800;font-size:12.5px;white-space:nowrap}
  .trend.bull{color:var(--up)} .trend.bear{color:var(--down)}
  .trend.flat{color:var(--ink-2)}
  .conf{font-size:10.5px;color:var(--ink-3);font-weight:600;margin-left:3px}
  .reason{max-width:290px;font-size:12px;color:var(--ink-2);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar{height:5px;border-radius:3px;background:#eef1f7;overflow:hidden;
    width:62px;display:inline-block;vertical-align:middle;margin-left:6px}
  .bar span{display:block;height:100%;border-radius:3px}

  /* 详情展开 */
  .detail td{background:#f7faff;padding:0;border-bottom:2px solid var(--line)}
  .detail-inner{padding:16px 18px;display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
  .dbox{background:#fff;border:1px solid var(--line);border-radius:9px;padding:12px 14px}
  .dbox h4{font-size:12.5px;font-weight:800;margin-bottom:9px;
    display:flex;align-items:center;gap:6px;color:var(--ink)}
  .dbox h4 .dot{width:7px;height:7px;border-radius:50%;background:var(--brand)}
  .dbox.risk-h4 h4 .dot{background:var(--high)}
  .dbox.trend-h4 h4 .dot{background:var(--up)}
  .dbox ul{list-style:none;display:flex;flex-direction:column;gap:7px}
  .dbox li{font-size:12px;color:var(--ink-2);padding-left:15px;position:relative;
    line-height:1.65}
  .dbox li::before{content:"";position:absolute;left:2px;top:6px;width:5px;height:5px;
    border-radius:50%;background:#c3cbdb}
  .dbox li.warn::before{background:var(--high)}
  .dbox li.good::before{background:var(--up)}
  .news-item{font-size:11.5px;color:var(--ink-2);padding:7px 0;
    border-bottom:1px dashed #edf0f6;line-height:1.55}
  .news-item:last-child{border-bottom:none}
  .news-item .nd{color:var(--ink-3);font-size:10.5px;margin-right:5px}
  .news-item a{color:var(--brand);text-decoration:none}
  .news-item a:hover{text-decoration:underline}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:12px}
  .kv .k{color:var(--ink-3)} .kv .v{color:var(--ink);font-weight:600;text-align:right}
  .factors{display:flex;gap:8px;margin-bottom:9px;flex-wrap:wrap}
  .fac{background:#f4f6fa;border-radius:7px;padding:6px 10px;font-size:11px;
    color:var(--ink-2);font-weight:600}
  .fac b{font-family:ui-monospace,monospace;margin-left:3px}
  .fac.p b{color:var(--up)} .fac.n b{color:var(--down)}
  .empty{padding:50px;text-align:center;color:var(--ink-3)}
  .disc{background:#fff9e9;border:1px solid #f3e2b3;border-radius:10px;
    padding:11px 15px;font-size:11.5px;color:#8a6d20;margin-top:16px;line-height:1.65}
  .disc b{color:#6b5310}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#ccd4e0;border-radius:5px}
  ::-webkit-scrollbar-thumb:hover{background:#aab6c8}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">涨</div>
      <div>
        <h1>A股涨停跟踪分析器</h1>
        <div class="sub">涨停时间 · 涨因归因 · 风险评级 · 趋势预测</div>
      </div>
    </div>
    <div class="meta">
      <div class="pill">交易日 <b id="mDate">--</b></div>
      <div class="pill">生成 <b id="mGen">--</b></div>
      <button class="btn ghost" id="btnExpand">展开全部</button>
      <button class="btn ghost" id="btnCsv">导出 CSV</button>
    </div>
  </header>

  <div class="kpis" id="kpis"></div>

  <div class="charts">
    <div class="card"><h3>板块主力资金流 Top10</h3><div id="cFlow" class="chart"></div></div>
    <div class="card"><h3>涨停封板时间分布</h3><div id="cTime" class="chart"></div></div>
    <div class="card"><h3>连板梯队</h3><div id="cLadder" class="chart"></div></div>
  </div>

  <div class="toolbar">
    <div class="seg" id="segRisk">
      <button data-v="all" class="on">全部</button>
      <button data-v="高风险">高风险</button>
      <button data-v="中风险">中风险</button>
      <button data-v="低风险">低风险</button>
    </div>
    <div class="seg" id="segTrend">
      <button data-v="all" class="on">全部趋势</button>
      <button data-v="bull">看多</button>
      <button data-v="flat">震荡</button>
      <button data-v="bear">看空</button>
    </div>
    <input class="search" id="q" placeholder="搜索股票代码 / 名称 / 行业 / 涨因关键词...">
    <select class="sel" id="sort">
      <option value="time">按封板时间</option>
      <option value="lb">按连板数</option>
      <option value="risk">按风险等级</option>
      <option value="trend">按趋势强度</option>
      <option value="hs">按换手率</option>
      <option value="fund">按封板资金</option>
    </select>
    <span class="cnt">共 <b id="cnt">0</b> 只</span>
  </div>

  <div class="tbl-wrap">
    <div class="tbl-scroll">
      <table>
        <thead>
          <tr>
            <th data-s="time">涨停时间<span class="srt">▼</span></th>
            <th data-s="code">股票代码</th>
            <th data-s="name">名称</th>
            <th data-s="lb">连板</th>
            <th data-s="lbzt">涨停统计</th>
            <th data-s="reason">上涨原因</th>
            <th data-s="risk">风险等级</th>
            <th data-s="trend">预测趋势</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <div class="disc">
    <b>说明与风险提示：</b>本工具数据来源于公开行情接口（东方财富），「上涨原因 / 涨后风险 / 趋势预测」由<b>规则引擎</b>依据封板时间、连板高度、换手率、封单强度、板块资金流与新闻关键词自动推演生成，<b>仅供参考，不构成任何投资建议</b>。股市有风险，入市需谨慎，请独立判断并自行承担交易风险。红涨绿跌。
  </div>
</div>

<script>
const TAGCLS = {
  "消息刺激型":"msg","资产重组":"msg","业绩预增":"msg","订单中标":"msg",
  "政策利好":"msg","技术突破":"msg","涨价提价":"money","回购增持":"low",
  "板块联动型":"sec","高度连板型":"lb","连板加速型":"lb","资金抢筹型":"money",
  "一字/T字板型":"one","低位补涨型":"low","资金驱动型":""
};
let DATA=null, VIEW=[];
let fRisk="all", fTrend="all", sortKey="time", expanded=new Set();

const fmtMoney = v => {
  if(!v) return "0";
  const y = v/1e8;
  if(y>=1) return y.toFixed(2)+"亿";
  return (v/1e4).toFixed(1)+"万";
};
const timeNum = t => t==="--" ? 999999 : parseInt(t.replace(/:/g,""),10);
const riskRank = l => ({"高风险":3,"中风险":2,"低风险":1})[l]||0;
const trendCls = t => (t.includes("看多")||t.includes("偏多"))?"bull"
                    : (t.includes("看空")||t.includes("偏空"))?"bear":"flat";
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function load(data){
  DATA = data;
  const s = data.summary;
  document.getElementById("mDate").textContent = s["日期"]||"--";
  document.getElementById("mGen").textContent = (s["生成时间"]||"--").slice(5);
  renderKpis(s);
  renderCharts(s);
  applyFilter();
}

function renderKpis(s){
  const items = [
    {l:"涨停家数", v:s["涨停家数"], x:"含全部封板个股", c:"up"},
    {l:"炸板家数", v:s["炸板家数"], x:"炸板率 "+(s["炸板率"]||0)+"%", c:"dn"},
    {l:"最高连板", v:s["最高连板"], x:"市场高度", c:"up"},
    {l:"高风险个股", v:s["高风险个股数"], x:"需重点警惕", c:"wn"},
    {l:"强势大涨股", v:s["强势股数量"], x:"涨幅居前", c:"up"},
    {l:"领涨板块", v:(s["领涨板块"]||"--"), x:"涨幅 "+(s["领涨板块涨幅"]||0)+"%", c:""},
    {l:"板块主力净流入", v:(s["领涨板块主力净流入亿元"]||0)+"亿", x:s["领涨板块"]||"--", c:""},
  ];
  document.getElementById("kpis").innerHTML = items.map(i=>`
    <div class="kpi ${i.c}">
      <div class="k-l">${i.l}</div>
      <div class="k-v" style="${String(i.v).length>5?'font-size:16px':''}">${esc(i.v)}</div>
      <div class="k-x">${esc(i.x)}</div>
    </div>`).join("");
}

const AXIS = {axisLine:{lineStyle:{color:"#dfe5ef"}},axisLabel:{color:"#8a93a3",fontSize:10},
  splitLine:{lineStyle:{color:"#f0f3f8"}}};

function renderCharts(s){
  // 1) 板块资金流
  const sectors = (s["板块资金流"]||[]).slice(0,10).reverse();
  const cf = echarts.init(document.getElementById("cFlow"));
  cf.setOption({
    grid:{left:70,right:52,top:8,bottom:6},
    tooltip:{trigger:"axis",axisPointer:{type:"shadow"},
      formatter:p=>{const d=sectors[p[0].dataIndex];
        return `<b>${d["板块名称"]}</b><br/>主力净流入：${(d["主力净流入"]/1e8).toFixed(2)} 亿<br/>板块涨幅：${d["涨跌幅"]}%<br/>领涨股：${d["领涨股"]||"--"}`;}},
    xAxis:{type:"value",...AXIS,axisLabel:{...AXIS.axisLabel,
      formatter:v=>(v/1e8).toFixed(0)+"亿"}},
    yAxis:{type:"category",data:sectors.map(d=>d["板块名称"]),
      axisLine:{lineStyle:{color:"#dfe5ef"}},axisTick:{show:false},
      axisLabel:{color:"#5a6473",fontSize:11,fontWeight:600}},
    series:[{type:"bar",data:sectors.map(d=>({
        value:d["主力净流入"],
        itemStyle:{color:d["主力净流入"]>=0?"#d92b2b":"#129d3e",borderRadius:[0,4,4,0]}})),
      barWidth:"62%",
      label:{show:true,position:"right",fontSize:10,color:"#5a6473",
        formatter:p=>(p.value/1e8).toFixed(1)+"亿"}}]
  });

  // 2) 时间分布
  const dist = s["涨停时间分布"]||{};
  const ct = echarts.init(document.getElementById("cTime"));
  ct.setOption({
    grid:{left:44,right:16,top:22,bottom:6},
    tooltip:{trigger:"axis",axisPointer:{type:"shadow"}},
    xAxis:{type:"category",data:Object.keys(dist),
      axisLabel:{color:"#5a6473",fontSize:10,interval:0,rotate:22},
      axisLine:{lineStyle:{color:"#dfe5ef"}},axisTick:{show:false}},
    yAxis:{type:"value",name:"家数",nameTextStyle:{color:"#8a93a3",fontSize:10},...AXIS},
    series:[{type:"bar",data:Object.values(dist),barWidth:"52%",
      itemStyle:{borderRadius:[4,4,0,0],
        color:new echarts.graphic.LinearGradient(0,0,0,1,[
          {offset:0,color:"#e35555"},{offset:1,color:"#c01c1c"}])},
      label:{show:true,position:"top",fontSize:10,color:"#8a93a3"}}]
  });

  // 3) 连板梯队
  const ladder = s["连板梯队"]||{};
  const keys = Object.keys(ladder).sort((a,b)=>parseInt(b)-parseInt(a));
  const cl = echarts.init(document.getElementById("cLadder"));
  cl.setOption({
    grid:{left:70,right:44,top:8,bottom:6},
    tooltip:{trigger:"axis",axisPointer:{type:"shadow"},
      formatter:p=>`<b>${keys[p[0].dataIndex]}</b><br/>${ladder[keys[p[0].dataIndex]].join("、")}`},
    xAxis:{type:"value",...AXIS,minInterval:1},
    yAxis:{type:"category",data:keys,axisTick:{show:false},
      axisLine:{lineStyle:{color:"#dfe5ef"}},
      axisLabel:{color:"#5a6473",fontSize:11,fontWeight:600}},
    series:[{type:"bar",data:keys.map(k=>{
        const n=parseInt(k)||1;
        return {value:ladder[k].length,
          itemStyle:{color:n>=5?"#8c0808":n>=3?"#c01c1c":n>=2?"#e08a1e":"#4a86e8",
            borderRadius:[0,4,4,0]}};}),
      barWidth:"58%",
      label:{show:true,position:"right",fontSize:10,color:"#5a6473",
        formatter:p=>p.value+" 家"}}]
  });
  window.addEventListener("resize",()=>{cf.resize();ct.resize();cl.resize();});
}

function applyFilter(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  VIEW = (DATA.records||[]).filter(r=>{
    if(fRisk!=="all" && r["风险等级"]!==fRisk) return false;
    if(fTrend!=="all"){
      const c = trendCls(r["预测趋势"]);
      if(fTrend==="bull" && c!=="bull") return false;
      if(fTrend==="flat" && c!=="flat") return false;
      if(fTrend==="bear" && c!=="bear") return false;
    }
    if(q){
      const blob = [r["代码"],r["名称"],r["所属行业"],r["上涨原因"],
        (r["原因标签"]||[]).join(" "),(r["关联新闻"]||[]).join(" ")].join(" ").toLowerCase();
      if(!blob.includes(q)) return false;
    }
    return true;
  });
  sortView();
  renderTable();
}

function sortView(){
  const cmp = {
    time:(a,b)=>timeNum(a["首封时间"])-timeNum(b["首封时间"]),
    lb:(a,b)=>b["连板数"]-a["连板数"] || timeNum(a["首封时间"])-timeNum(b["首封时间"]),
    risk:(a,b)=>riskRank(b["风险等级"])-riskRank(a["风险等级"]) || b["风险分值"]-a["风险分值"],
    trend:(a,b)=>b["趋势分"]-a["趋势分"],
    hs:(a,b)=>b["换手率"]-a["换手率"],
    fund:(a,b)=>b["封板资金"]-a["封板资金"],
    code:(a,b)=>String(a["代码"]).localeCompare(String(b["代码"])),
    name:(a,b)=>String(a["名称"]).localeCompare(String(b["名称"]),"zh"),
    reason:(a,b)=>String(a["上涨原因"]).localeCompare(String(b["上涨原因"]),"zh"),
    lbzt:(a,b)=>b["连板数"]-a["连板数"],
  }[sortKey] || (()=>0);
  VIEW.sort(cmp);
}

function renderTable(){
  document.getElementById("cnt").textContent = VIEW.length;
  const tb = document.getElementById("tbody");
  if(!VIEW.length){ tb.innerHTML = `<tr><td colspan="8" class="empty">没有匹配的记录</td></tr>`; return; }
  tb.innerHTML = VIEW.map(r=>{
    const tn = timeNum(r["首封时间"]);
    const early = tn<=93500 ? "early" : "";
    const lb = r["连板数"]||1;
    const lbc = lb>=5?"h5":lb>=4?"h4":lb>=3?"h3":lb>=2?"h2":"";
    const tags = (r["原因标签"]||[]).slice(0,3).map(t=>
      `<span class="tag ${TAGCLS[t]||""}">${esc(t)}</span>`).join("");
    const tCls = trendCls(r["预测趋势"]);
    const rk = r["风险等级"], rc = r["风险色"];
    const score = Math.min(100, (r["风险分值"]||0)*12);
    const barC = rc==="high"?"#d92b2b":rc==="mid"?"#e08a1e":"#129d3e";
    const open = expanded.has(r["代码"]);
    let html = `<tr data-code="${r["代码"]}" class="${open?"open":""}">
      <td><span class="time ${early}">${r["首封时间"]}</span></td>
      <td><span class="code">${r["代码"]}</span></td>
      <td><span class="nm">${esc(r["名称"])}</span></td>
      <td><span class="lb ${lbc}">${lb}</span></td>
      <td>${esc(r["涨停统计"])}</td>
      <td><div class="reason" title="${esc(r["上涨原因"])}">${esc(r["上涨原因"])}</div>
          <div style="margin-top:3px">${tags}</div></td>
      <td><span class="risk ${rc}"><i></i>${rk}</span>
          <span class="bar"><span style="width:${score}%;background:${barC}"></span></span></td>
      <td><span class="trend ${tCls}">${esc(r["预测趋势"])}</span>
          <div class="conf">置信 ${r["置信度"]} · ${r["趋势分"]>0?"+":""}${r["趋势分"]}</div></td>
    </tr>`;
    if(open) html += `<tr class="detail"><td colspan="8">${detailHtml(r)}</td></tr>`;
    return html;
  }).join("");
  tb.querySelectorAll("tr[data-code]").forEach(tr=>{
    tr.onclick = e=>{
      if(e.target.tagName==="A") return;
      const code = tr.getAttribute("data-code");
      expanded.has(code) ? expanded.delete(code) : expanded.add(code);
      renderTable();
    };
  });
}

function detailHtml(r){
  const f = r["预测因子"]||{};
  const fl = k=>{const v=f[k]||0; return `<span class="fac ${v>0?"p":v<0?"n":""}">${k}<b>${v>0?"+":""}${v}</b></span>`;};
  const riskLi = (r["涨后主要风险"]||[]).map(x=>`<li class="warn">${esc(x)}</li>`).join("");
  const sigLi = (r["趋势关键信号"]||[]).map(x=>`<li class="good">${esc(x)}</li>`).join("");
  const watchLi = (r["观察点"]||[]).map(x=>`<li>${esc(x)}</li>`).join("");
  const reasonLi = (r["归因依据"]||[]).map(x=>`<li>${esc(x)}</li>`).join("");
  const news = (r["关联新闻"]||[]);
  const newsHtml = news.length
    ? news.map((n,i)=>`<div class="news-item"><span class="nd">${esc(n.split("｜")[0]||"")}</span>${esc(n.split("｜")[1]||n)}</div>`).join("")
    : `<div class="news-item" style="color:#aab2c0">暂无关联新闻（未匹配到公开消息，或以资金/板块驱动为主）</div>`;
  return `<div class="detail-inner">
    <div class="dbox">
      <h4><span class="dot"></span>基础信息</h4>
      <div class="kv">
        <span class="k">股票代码</span><span class="v">${r["代码"]} · ${esc(r["市场"])}</span>
        <span class="k">首封时间</span><span class="v">${r["首封时间"]}</span>
        <span class="k">末封时间</span><span class="v">${r["末封时间"]}</span>
        <span class="k">涨停统计</span><span class="v">${esc(r["涨停统计"])}（${r["连板数"]}连板）</span>
        <span class="k">炸板次数</span><span class="v">${r["炸板次数"]} 次</span>
        <span class="k">换手率</span><span class="v">${r["换手率"]}%</span>
        <span class="k">封板资金</span><span class="v">${fmtMoney(r["封板资金"])}</span>
        <span class="k">成交额</span><span class="v">${r["成交额亿元"]} 亿</span>
        <span class="k">流通市值</span><span class="v">${r["流通市值亿元"]} 亿</span>
        <span class="k">所属行业</span><span class="v">${esc(r["所属行业"])}</span>
      </div>
    </div>
    <div class="dbox">
      <h4><span class="dot"></span>上涨原因 · 归因依据</h4>
      <div style="margin-bottom:8px">${(r["原因标签"]||[]).map(t=>`<span class="tag ${TAGCLS[t]||""}">${esc(t)}</span>`).join("")}</div>
      <ul>${reasonLi||"<li>暂无明确归因依据</li>"}</ul>
    </div>
    <div class="dbox risk-h4">
      <h4><span class="dot"></span>涨后主要风险 · ${r["风险等级"]}（分值 ${r["风险分值"]}）</h4>
      <ul>${riskLi}</ul>
    </div>
    <div class="dbox trend-h4">
      <h4><span class="dot"></span>趋势预测 · ${esc(r["预测趋势"])}（置信度 ${r["置信度"]}）</h4>
      <div class="factors">${fl("封板强度S")}${fl("板块效应E")}${fl("连板动能M")}</div>
      <ul>${sigLi}</ul>
      <div style="font-size:11.5px;color:#8a93a3;font-weight:700;margin:9px 0 5px">关键观察点</div>
      <ul>${watchLi}</ul>
    </div>
    <div class="dbox">
      <h4><span class="dot"></span>关联新闻</h4>
      ${newsHtml}
    </div>
  </div>`;
}

// 事件绑定
document.getElementById("segRisk").addEventListener("click",e=>{
  if(e.target.tagName!=="BUTTON")return;
  [...e.currentTarget.children].forEach(b=>b.classList.remove("on"));
  e.target.classList.add("on"); fRisk=e.target.dataset.v; applyFilter();
});
document.getElementById("segTrend").addEventListener("click",e=>{
  if(e.target.tagName!=="BUTTON")return;
  [...e.currentTarget.children].forEach(b=>b.classList.remove("on"));
  e.target.classList.add("on"); fTrend=e.target.dataset.v; applyFilter();
});
document.getElementById("q").addEventListener("input",applyFilter);
document.getElementById("sort").addEventListener("change",e=>{sortKey=e.target.value;applyFilter();});
document.getElementById("btnExpand").addEventListener("click",e=>{
  if(expanded.size){ expanded.clear(); e.target.textContent="展开全部"; }
  else { VIEW.forEach(r=>expanded.add(r["代码"])); e.target.textContent="收起全部"; }
  renderTable();
});
document.getElementById("btnCsv").addEventListener("click",()=>{
  const cols = ["代码","名称","首封时间","涨停统计","连板数","换手率","所属行业",
    "上涨原因","原因标签","风险等级","风险分值","涨后主要风险","预测趋势","趋势分","置信度"];
  const rows = [cols.join(",")].concat(VIEW.map(r=>cols.map(c=>{
    let v=r[c]; if(Array.isArray(v)) v=v.join("；");
    return `"${String(v==null?"":v).replace(/"/g,'""')}"`;
  }).join(",")));
  const blob = new Blob(["\ufeff"+rows.join("\n")],{type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `涨停跟踪_${DATA.summary["日期"]}.csv`;
  a.click();
});

(function(){
  const el = document.getElementById("inlineData");
  if(el){
    try { load(JSON.parse(el.textContent)); return; } catch(e){}
  }
  fetch("output/data.json").then(r=>r.json()).then(load).catch(err=>{
    document.getElementById("tbody").innerHTML =
      `<tr><td colspan="8" class="empty">读取数据失败：${esc(err.message)}<br/>
       <span style="font-size:12px">请先运行 <code>python3 build.py</code> 生成数据。</span></td></tr>`;
  });
})();
</script>
</body>
</html>
